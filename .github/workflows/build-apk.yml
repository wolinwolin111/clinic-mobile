name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Reuse APK signing key
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: clinic-mobile-debug-keystore-v2

      - name: Prepare APK signing key
        shell: bash
        run: |
          if [ ! -f .signing/debug.keystore ]; then
            mkdir -p .signing
            keytool -genkeypair -v \
              -keystore .signing/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Yueshu Clinic, OU=Mobile, O=Yueshu Rehabilitation, C=CN"
          fi

      - name: Build installable APK
        env:
          DEBUG_KEYSTORE_FILE: ${{ github.workspace }}/.signing/debug.keystore
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Name APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk clinic-mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-mobile-apk
          path: clinic-mobile.apk
          if-no-files-found: error
          retention-days: 30
